<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>ShopVPN</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand">ShopVPN</div>
        <div id="hello" class="muted">در حال بارگذاری...</div>
      </div>
      <button class="icon-btn" onclick="showPage('profile')">👤</button>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button onclick="showPage('home')" id="nav-home">🏠<span>خانه</span></button>
      <button onclick="showPage('shop')" id="nav-shop">🛒<span>فروشگاه</span></button>
      <button onclick="showPage('orders')" id="nav-orders">📦<span>سفارش‌ها</span></button>
      <button onclick="showPage('wallet')" id="nav-wallet">💳<span>کیف پول</span></button>
      <button onclick="showPage('profile')" id="nav-profile">👤<span>حساب</span></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" onclick="closeModal()">×</button>
      <div id="modal-content"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
